# Blueprint do Render — Fiscal de Contratos
#
# Aplicar via: Render Dashboard -> New + -> Blueprint -> escolher este repositório.
# O blueprint cria o banco Postgres gerenciado, o serviço do backend e o do
# parsing, e injeta a DATABASE_URL automaticamente em cada serviço (fromDatabase).

databases:
  - name: fiscal-db
    plan: free
    region: oregon
    databaseName: prefeitura
    user: fiscal
    postgresMajorVersion: "15"

services:
  # API apoiofiscal (Express + Prisma). Schema e seed são aplicados durante o build.
  - type: web
    name: apoiofiscal-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    # db push + seed rodam no build (free tier não suporta preDeployCommand);
    # ambos são idempotentes, então rodam a cada deploy sem efeitos colaterais.
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npx prisma db seed && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fiscal-db
          property: connectionString
      # Gerar em: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # Depois preencher em Services -> apoiofiscal-backend -> Environment.
      - key: JWT_SECRET
        sync: false

  # API de parsing de PDF (Express + pg). Garante a tabela pdf_data no build.
  - type: web
    name: apoiofiscal-parsing
    runtime: node
    rootDir: parsing
    plan: free
    region: oregon
    # db:init é idempotente e garante a tabela pdf_data antes do start.
    buildCommand: npm install --include=dev && npm run db:init && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PARSER_MODE
        value: rules
      - key: DATABASE_URL
        fromDatabase:
          name: fiscal-db
          property: connectionString